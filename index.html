<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1030">
<title>KRATHONG FAHSAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Sarabun:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<button type="button" class="music" id="music" aria-pressed="false">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h6V3H9z"/></svg>
  <span id="musicLabel">เปิดเพลง</span>
</button>
<audio id="song" loop preload="auto"></audio>

<div class="cap" id="cap" aria-live="polite">
  <small>คำอธิษฐานของเธอ</small>
  <span id="wishShown"></span>
</div>

<section class="panel" id="makePanel" aria-labelledby="mkTitle">
  <p class="eyebrow" id="toName">For You</p>
  <h1 id="mkTitle">กระทงของเธอ</h1>

  <canvas id="preview" class="preview" width="360" height="216" role="img" aria-label="ตัวอย่างกระทงที่เลือก"></canvas>

  <div class="tabs" id="tabs" role="group" aria-label="หมวดการตกแต่ง">
    <button type="button" class="tab" data-tab="0" aria-pressed="true">ลักษณะ</button>
    <button type="button" class="tab" data-tab="1" aria-pressed="false">ดอกไม้</button>
    <button type="button" class="tab" data-tab="2" aria-pressed="false">ธูปเทียน</button>
  </div>
  <div class="opts" id="opts" role="group"></div>

  <label class="field" for="wish"><span>คำอธิษฐาน</span><span id="count">0/80</span></label>
  <textarea id="wish" rows="2" maxlength="80" placeholder="คำอธิฐาน"></textarea>
  <button type="button" class="primary" id="launch">ลอยกระทง</button>
</section>

<section class="panel out" id="msgPanel" hidden aria-labelledby="msgTitle">
  <p class="eyebrow" id="msgFrom">กระทงของเธอลอยไปแล้ว</p>
  <h1 id="msgTitle"></h1>
  <p class="msg" id="msgText"></p>
  <button type="button" class="ghost" id="again">ลอยอีกใบ</button>
</section>

<script src="script.js"></script>
</body>
</html>
